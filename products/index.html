<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数字产品商店 - H24</title>
<meta name="description" content="开发者模板、Notion 模板等数字产品。">
<link rel="stylesheet" href="../css/style.css">
<style>
.p-hero{text-align:center;padding:3rem 1.5rem 2rem;background:linear-gradient(135deg,#fdf2f8,#fff1f2,#fef9c3)}
.p-hero h1{font-size:2rem;font-weight:800;margin-bottom:.5rem}
.p-section{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem;flex:1}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.p-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.p-card .p-head{height:120px;display:flex;align-items:center;justify-content:center;font-size:3rem}
.p-card .p-body{padding:1rem 1.2rem;flex:1}
.p-card .p-body h3{font-size:1rem;font-weight:600;margin-bottom:.3rem}
.p-card .p-body p{font-size:.85rem;color:var(--gray-500);line-height:1.6}
.p-card .p-foot{border-top:1px solid var(--gray-100);padding:.7rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
.p-card .price{font-weight:700;color:var(--primary)}
.p-card .btn-buy{padding:.35rem .9rem;border-radius:6px;border:none;background:var(--primary);color:#fff;font-size:.83rem;font-weight:600;cursor:pointer}
.p-card .btn-buy:hover{background:var(--primary-dark)}
.pay-note{max-width:500px;margin:2rem auto;text-align:center;font-size:.83rem;color:var(--gray-400)}
@media(max-width:640px){.p-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a href="../" class="logo"><span class="logo-icon">H24</span><span>商店</span></a><nav class="header-nav"><a href="../">工具</a></nav></div></header>
<section class="p-hero"><h1>数字产品商店</h1><p>开发者效率模板，即买即用，一次购买终身使用</p></section>
<section class="p-section">
<div class="p-grid" id="pGrid"></div>
<div class="pay-note">支付通过爱发电 / Gumroad 安全处理<br>购买后邮件发送下载链接</div>
</section>
<footer class="site-footer">H24 工具箱 &copy; 2026</footer>
<script>
var prods=[
{name:'开发者简历模板',desc:'ATS 友好简历模板，Markdown/Word/HTML 三格式，含 STAR 写法指南。',icon:'📄',price:'9.9',color:'#6366f1'},
{name:'Notion 项目面板',desc:'任务看板、OKR 追踪、周报汇总，适合小团队和个人开发者。',icon:'📋',price:'19.9',color:'#10b981',old:'29.9'},
{name:'Chrome 扩展套件',desc:'Manifest V3，TS + React，消息通信示例，一键打包脚本。',icon:'🧩',price:'29.9',color:'#f59e0b'},
{name:'开发者速查手册',desc:'Git / Docker / Linux 命令 + VS Code 快捷键 + 正则，一页浓缩。',icon:'📖',price:'4.9',color:'#0891b2'},
{name:'每周食谱规划表',desc:'Notion/Excel 版本，购物清单自动生成，热量估算。',icon:'📅',price:'9.9',color:'#ec4899'},
{name:'极简 Markdown 简历',desc:'纯 Markdown 简历，专注内容，一键导出 PDF，外企友好。',icon:'✍️',price:'免费',color:'#14b8a6',free:true}
];
document.getElementById('pGrid').innerHTML=prods.map(function(p){return'<div class=p-card><div class=p-head style=background:linear-gradient(135deg,'+p.color+'22,'+p.color+'11)>'+p.icon+'</div><div class=p-body><h3>'+p.name+'</h3><p>'+p.desc+'</p></div><div class=p-foot><div class=price>'+(p.old?'<s style=color:var(--gray-400);font-size:.8rem>'+p.old+'</s> ':'')+(p.free?'<span style=color:#059673>免费</span>':'<span>'+p.price+'</span>')+'</div><button class=btn-buy>'+(p.free?'免费下载':'购买')+'</button></div></div>'}).join('');
</script>
</body>
</html>
