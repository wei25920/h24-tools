<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>H24 工具箱 - 在线实用工具合集</title>
<meta name="description" content="免费在线工具：二维码生成、JSON格式化、密码生成、Base64编解码、时间戳转换、URL编解码、字数统计、颜色转换等。">
<link rel="stylesheet" href="css/style.css">

<script defer src="https://cloud.umami.is/script.js" data-website-id="请填入你的 Umami 网站 ID"></script>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a href="./" class="logo"><span class="logo-icon">H24</span><span>工具箱</span></a>
<nav class="header-nav"><a href="#tools">全部工具</a><a href="products/">商店</a><a href="#about">关于</a></nav>
</div>
</header>
<section class="hero"><h1>在线工具 · 即开即用</h1><p>免费、纯前端，你的数据不会上传到服务器。</p>
<div class="hero-search"><input type="text" id="searchInput" placeholder="搜索工具..." oninput="filterTools()"></div>
</section>
<section class="tools-section" id="tools">
<div class="section-header"><h2>全部工具 <span class="tool-count" id="toolCount"></span></h2></div>
<div class="tool-grid" id="toolGrid"></div>
</section>
<section class="about-section" id="about">
<div><h3>关于 H24 工具箱</h3><p>所有工具均为纯前端实现，数据仅在浏览器本地处理，不会上传任何服务器。完全免费，无需注册。</p>
<a href="products/" class="btn">数字商店</a></div>
</section>
<footer class="site-footer">H24 工具箱 &copy; 2026</footer>
<div id="toast" class="toast"></div>
<script src="js/main.js"></script>
<script>
const tools=[
{id:'qrcode',name:'二维码生成器',desc:'文本/链接生成二维码，下载 PNG',icon:'📱',color:'#6366f1',tag:'热门'},
{id:'password',name:'密码生成器',desc:'高强度随机密码，可配置',icon:'🔑',color:'#f59e0b',tag:''},
{id:'json',name:'JSON 格式化',desc:'格式化、压缩、校验 JSON',icon:'📋',color:'#10b981',tag:'热门'},
{id:'base64',name:'Base64 编解码',desc:'文本与文件 Base64 互转',icon:'🔐',color:'#8b5cf6',tag:''},
{id:'urlcode',name:'URL 编解码',desc:'URL 百分号编码与解码',icon:'🔗',color:'#06b6d4',tag:''},
{id:'timestamp',name:'时间戳转换',desc:'Unix 时间戳与日期互转',icon:'⏰',color:'#ec4899',tag:''},
{id:'wordcount',name:'字数统计',desc:'中英文字数实时统计',icon:'📝',color:'#14b8a6',tag:''},
{id:'color',name:'颜色转换器',desc:'HEX/RGB/HSL 格式互转',icon:'🎨',color:'#f97316',tag:''},
{id:'regex',name:'正则测试器',desc:'正则表达式实时匹配高亮',icon:'🧪',color:'#7c3aed',tag:'新'},
{id:'diff',name:'文本对比工具',desc:'逐行差异对比高亮',icon:'📊',color:'#0891b2',tag:'新'}];
function renderTools(list){document.getElementById('toolGrid').innerHTML=list.map(t=>{return'<a href=tools/'+t.id+'.html class=tool-card-link><div class=tool-card>'+(t.tag?'<span class=card-tag>'+(t.tag=='热门'?'card-hot':'')+'>'+t.tag+'</span>':'')+'<div class=tool-card-icon style=background:'+t.color+'15;color:'+t.color+'>'+t.icon+'</div><h3>'+t.name+'</h3><p>'+t.desc+'</p></div></a>'}).join('');document.getElementById('toolCount').textContent='('+list.length+')'}
function filterTools(){var q=document.getElementById('searchInput').value.toLowerCase();renderTools(tools.filter(function(t){return t.name.includes(q)||t.desc.includes(q)}))}
renderTools(tools);
</script>
</body>
</html>
