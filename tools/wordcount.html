<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字数统计 - H24 工具箱</title>
  <meta name="description" content="免费在线字数统计工具，支持中英文、字符数、单词数、行数、段落数实时统计。">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="../" class="logo"><span class="logo-icon">H24</span><span>工具箱</span></a>
    <nav class="header-nav"><a href="../">← 返回首页</a></nav>
  </div>
</header>
<main class="tool-page">
  <div class="tool-page-header">
    <a href="../" class="back-link">← 返回全部工具</a>
    <h1>📝 字数统计</h1>
    <p>实时统计中英文字数、字符数、单词数、行数、段落数。</p>
  </div>
  <div class="tool-box">
    <div class="input-group">
      <label for="wcInput">输入文本</label>
      <textarea id="wcInput" rows="10" placeholder="在此输入或粘贴文本，实时统计…" oninput="updateStats()" style="min-height:200px"></textarea>
    </div>
    <div id="wcStats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem;margin-top:1rem">
      <div class="stat-card"><div class="stat-label">总字符</div><div class="stat-value" id="statChars">0</div></div>
      <div class="stat-card"><div class="stat-label">中文字数</div><div class="stat-value" id="statChinese">0</div></div>
      <div class="stat-card"><div class="stat-label">英文字数</div><div class="stat-value" id="statWords">0</div></div>
      <div class="stat-card"><div class="stat-label">数字</div><div class="stat-value" id="statDigits">0</div></div>
      <div class="stat-card"><div class="stat-label">标点符号</div><div class="stat-value" id="statPunct">0</div></div>
      <div class="stat-card"><div class="stat-label">空格</div><div class="stat-value" id="statSpaces">0</div></div>
      <div class="stat-card"><div class="stat-label">行数</div><div class="stat-value" id="statLines">0</div></div>
      <div class="stat-card"><div class="stat-label">段落</div><div class="stat-value" id="statParas">0</div></div>
    </div>
  </div>
  <style>
    .stat-card {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: .8rem;
      text-align: center;
    }
    .stat-label { font-size:.8rem; color: var(--gray-400); margin-bottom:.25rem; }
    .stat-value { font-size:1.4rem; font-weight:700; color: var(--primary); }
  </style>
</main>
<footer class="site-footer"><p>H24 工具箱 &copy; 2026</p></footer>
<script src="../js/main.js"></script>
<script>
function updateStats() {
  const text = $('wcInput').value;
  $('statChars').textContent = text.length;
  $('statChinese').textContent = (text.match(/[\u4e00-\u9fa5\u3400-\u4dbf]/g) || '').length;
  $('statWords').textContent = (text.match(/[a-zA-Z]+/g) || '').length;
  $('statDigits').textContent = (text.match(/[0-9]/g) || '').length;
  $('statPunct').textContent = (text.match(/[^\w\s\u4e00-\u9fa5]/g) || '').length;
  $('statSpaces').textContent = (text.match(/\s/g) || '').length;
  $('statLines').textContent = text ? text.split('\n').length : 0;
  $('statParas').textContent = text ? text.split(/\n\s*\n/).filter(p => p.trim()).length : 0;
}
</script>
</body>
</html>
