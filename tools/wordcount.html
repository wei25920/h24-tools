<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>字数统计 - H24 工具箱</title>
<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><a href="../">H24 工具箱</a></header>
<main><h1>字数统计</h1>
<p>实时统计中英文字数。</p>
<div><textarea id="t" rows="8" oninput="s()" placeholder="输入文本..."></textarea>
<div id="r"></div></div>
</main>
<script>
function s(){var t=document.getElementById('t').value;document.getElementById('r').innerHTML=
'总字符: '+t.length+'<br>中文字: '+(t.match(/[\u4e00-\u9fff]/g)||[]).length+'<br>英文词: '+(t.match(/[a-zA-Z]+/g)||[]).length+'<br>行数: '+(t?t.split('\n').length:0)}
</script>
</body></html>
