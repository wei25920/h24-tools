<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><a href="../">H24 工具箱</a></header>
<main><h1>🔑 密码生成器</h1><p>生成高强度随机密码，保护账号安全。</p>
<div><label>密码长度</label><input type="range" id="l" min="4" max="64" value="16" oninput="document.getElementById('v').textContent=this.value">
<span id="v">16</span>
<button onclick="gp()">生成密码</button>
<pre id="r"></pre></div>
</main>
<footer>H24 工具箱</footer>
<script>
function gp(){var n=parseInt(document.getElementById('l').value);var c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#%^&*';var a=new Uint8Array(n);crypto.getRandomValues(a);var p='';for(var i=0;i<n;i++)p+=c[a[i]%c.length];document.getElementById('r').textContent=p}
</script>
