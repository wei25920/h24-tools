<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>密码生成器 - H24 工具箱</title>
<meta name="description" content="免费在线密码生成器。">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a href="../" class="logo"><span class="logo-icon">H24</span><span>工具箱</span></a>
<nav class="header-nav"><a href="../">返回首页</a></nav>
</div>
</header>
<main class="tool-page">
<div class="tool-page-header"><a href="../" class="back-link">返回全部工具</a><h1>密码生成器</h1><p>生成高强度随机密码。</p></div>
<div class="tool-box">
<div class="input-group"><label for="pwdLen">密码长度</label>
<input type="range" id="pwdLen" min="4" max="64" value="16" oninput="document.getElementById('pl').textContent=this.value">
<div style="display:flex;justify-content:space-between"><span>4</span><span id="pl">16</span><span>64</span></div></div>
<div class="input-group"><label>字符类型</label>
<div style="display:flex;gap:1rem;flex-wrap:wrap">
<label><input type="checkbox" id="cu" checked> 大写 A-Z</label>
<label><input type="checkbox" id="cl" checked> 小写 a-z</label>
<label><input type="checkbox" id="cd" checked> 数字 0-9</label>
<label><input type="checkbox" id="cs"> 符号</label>
</div></div>
<div class="btn-row"><button class="btn btn-primary" onclick="gen()">生成密码</button></div>
<div id="pr"></div>
</div>
</main>
<footer class="site-footer">H24 工具箱 &copy; 2026</footer>
<script src="../js/main.js"></script>
<script>
function gen(){
var l=parseInt(document.getElementById('pwdLen').value);
var c='';
if(document.getElementById('cu').checked)c+='ABCDEFGHJKLMNPQRSTUVWXYZ';
if(document.getElementById('cl').checked)c+='abcdefghijkmnpqrstuvwxyz';
if(document.getElementById('cd').checked)c+='23456789';
if(document.getElementById('cs').checked)c+='!@#%^&*()_+-=[]{}|;:,.<>?';
if(!c){toast('至少选一种');return}
var a=new Uint8Array(l);crypto.getRandomValues(a);var p='';
for(var i=0;i<l;i++)p+=c[a[i]%c.length];
document.getElementById('pr').textContent=p}
</script>
</body>
</html>
