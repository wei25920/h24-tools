<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>馃攽</text></svg>">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="../" class="logo"><span class="logo-icon">H24</span><span>宸ュ叿绠?/span></a>
    <nav class="header-nav"><a href="../">鈫?杩斿洖棣栭〉</a></nav>
  </div>
</header>
<main class="tool-page">
<div class="tool-page-header">
  <a href="../" class="back-link">鈫?杩斿洖鍏ㄩ儴宸ュ叿</a>
  <h1>馃攽 瀵嗙爜鐢熸垚鍣?/h1>
  <p>鐢熸垚楂樺己搴﹂殢鏈哄瘑鐮侊紝鍙嚜瀹氫箟闀垮害鍜屽瓧绗︾被鍨嬶紝涓€閿鍒躲€?/p>
</div>
<div class="tool-box">
  <div class="input-group">
    <label for="pwdLength">瀵嗙爜闀垮害</label>
    <input type="range" id="pwdLength" min="4" max="64" value="16" oninput="updateLabel()">
    <div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--gray-400)">
      <span>4</span><span id="lenLabel">16</span><span>64</span>
    </div>
  </div>
  <div class="input-group">
    <label>瀛楃绫诲瀷</label>
    <div style="display:flex;gap:1.2rem;flex-wrap:wrap">
      <label style="font-weight:400;cursor:pointer;display:flex;align-items:center;gap:.35rem"><input type="checkbox" id="chkUpper" checked> 澶у啓 A-Z</label>
      <label style="font-weight:400;cursor:pointer;display:flex;align-items:center;gap:.35rem"><input type="checkbox" id="chkLower" checked> 灏忓啓 a-z</label>
      <label style="font-weight:400;cursor:pointer;display:flex;align-items:center;gap:.35rem"><input type="checkbox" id="chkDigit" checked> 鏁板瓧 0-9</label>
      <label style="font-weight:400;cursor:pointer;display:flex;align-items:center;gap:.35rem"><input type="checkbox" id="chkSymbol" checked> 绗﹀彿 !@#%</label>
    </div>
  </div>
  <div class="input-group">
    <label for="pwdCount">鐢熸垚鏁伴噺</label>
    <select id="pwdCount">
      <option value="1">1 涓?/option>
      <option value="5" selected>5 涓?/option>
      <option value="10">10 涓?/option>
      <option value="20">20 涓?/option>
    </select>
  </div>
  <div class="btn-row"><button class="btn btn-primary" onclick="genPwd()">鐢熸垚瀵嗙爜</button></div>
  <div id="pwdResults"></div>
</div>
</main>
<footer class="site-footer">`n  H24 工具箱 &copy; 2026 &middot; <a href="../products/">数字商店</a> &middot; 纯前端 &middot; 隐私安全`n</footer>
<div id="toast" class="toast"></div>
<script src="../js/main.js"></script>
<script>
function updateLabel(){document.getElementById('lenLabel').textContent=document.getElementById('pwdLength').value}
function genPwd(){
  const len=parseInt(document.getElementById('pwdLength').value),cnt=parseInt(document.getElementById('pwdCount').value);
  const u=document.getElementById('chkUpper').checked,l=document.getElementById('chkLower').checked,d=document.getElementById('chkDigit').checked,s=document.getElementById('chkSymbol').checked;
  if(!u&&!l&&!d&&!s){toast('鑷冲皯閫変竴绉嶅瓧绗︾被鍨?);return}
  let chars='';if(u)chars+='ABCDEFGHJKLMNPQRSTUVWXYZ';if(l)chars+='abcdefghijkmnpqrstuvwxyz';if(d)chars+='23456789';if(s)chars+='!@#%^&*()_-+=[]{}|;:,.<>?';
  const arr=new Uint8Array(len*cnt);crypto.getRandomValues(arr);
  const res=[];let idx=0;
  for(let n=0;n<cnt;n++){let p='';for(let i=0;i<len;i++)p+=chars[arr[idx++]%chars.length];res.push(p)}
  document.getElementById('pwdResults').innerHTML=res.map(function(p){return '<div class="result-box" style="display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem"><code style="font-size:1rem;user-select:all">'+p+'</code><button class="btn btn-sm btn-secondary" onclick="navigator.clipboard.writeText("'+p+'").then(function(){toast("宸插鍒?)})">澶嶅埗</button></div>'}).join('');
}
genPwd();
</script>
</body>
</html>
