  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">

<body>
<header class="site-header">
  <div class="header-inner">
    <a href="../" class="logo"><span class="logo-icon">H24</span><span>工具�?/span></a>

<main class="tool-page">
  <div class="tool-page-header">
    <a href="../" class="back-link">�?返回全部工具</a>
    <h1>🔑 密码生成�?/h1>
    <p>生成高强度随机密码，保护你的账号安全�?/p>
  </div>
  <div class="tool-box">
    <div class="input-group">
      <label for="pwdLength">密码长度</label>
      <input type="range" id="pwdLength" min="4" max="64" value="16" oninput="updateLengthLabel()">
      <div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--gray-400)">
        <span>4</span>
        <span id="lengthLabel">16</span>
        <span>64</span>
      </div>
    </div>
    <div class="input-group">
      <label style="margin-bottom:.3rem">字符类型</label>
      <div style="display:flex;gap:1.2rem;flex-wrap:wrap">
        <label style="font-weight:400;font-size:.9rem;display:flex;align-items:center;gap:.35rem;cursor:pointer">
          <input type="checkbox" id="chkUpper" checked> 大写 A-Z
        </label>
        <label style="font-weight:400;font-size:.9rem;display:flex;align-items:center;gap:.35rem;cursor:pointer">
          <input type="checkbox" id="chkLower" checked> 小写 a-z
        </label>
        <label style="font-weight:400;font-size:.9rem;display:flex;align-items:center;gap:.35rem;cursor:pointer">
          <input type="checkbox" id="chkDigit" checked> 数字 0-9
        </label>
        <label style="font-weight:400;font-size:.9rem;display:flex;align-items:center;gap:.35rem;cursor:pointer">
          <input type="checkbox" id="chkSymbol" checked> 符号 !@#$%
        </label>
        <label style="font-weight:400;font-size:.9rem;display:flex;align-items:center;gap:.35rem;cursor:pointer">
          <input type="checkbox" id="chkExclude" onchange="toggleExcludeInput()"> 排除易混淆字�?        </label>
      </div>
    </div>
    <div class="input-group hidden" id="excludeGroup">
      <label for="excludeChars">排除字符</label>
      <input type="text" id="excludeChars" value="0OIl1" placeholder="输入要排除的字符">
    </div>
    <div class="input-group">
      <label for="pwdCount">生成数量</label>
      <select id="pwdCount">
        <option value="1">1 �?/option>
        <option value="5" selected>5 �?/option>
        <option value="10">10 �?/option>
        <option value="20">20 �?/option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="generatePasswords()">🔄 生成密码</button>

<div id="toast" class="toast"></div>
<script src="../js/main.js"></script>
<script>
function updateLengthLabel() {
  $('lengthLabel').textContent = $('pwdLength').value;
}
function toggleExcludeInput() {
  $('excludeGroup').classList.toggle('hidden', !$('chkExclude').checked);
}
function generatePasswords() {
  const len = parseInt($('pwdLength').value);
  const count = parseInt($('pwdCount').value);
  const useUpper = $('chkUpper').checked;
  const useLower = $('chkLower').checked;
  const useDigit = $('chkDigit').checked;
  const useSymbol = $('chkSymbol').checked;
  const excludeStr = $('chkExclude').checked ? $('excludeChars').value : '';

  if (!useUpper && !useLower && !useDigit && !useSymbol) {
    toast('⚠️ 至少选择一种字符类�?); return;
  }

  let chars = '';
  if (useUpper) chars += 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  if (useLower) chars += 'abcdefghijkmnpqrstuvwxyz';
  if (useDigit) chars += '23456789';
  if (useSymbol) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

  // Remove excluded chars
  if (excludeStr) {
    for (const c of excludeStr) chars = chars.replaceAll(c, '');
  }
  if (!chars.length) { toast('⚠️ 可用字符太少，请调整选项'); return; }

  const crypto = window.crypto || window.msCrypto;
  const getRandomByte = crypto ? () => { const a = new Uint8Array(1); crypto.getRandomValues(a); return a[0]; } : () => Math.floor(Math.random() * 256);

  const results = [];
  for (let n = 0; n < count; n++) {
    let pwd = '';
    for (let i = 0; i < len; i++) {
      pwd += chars[getRandomByte() % chars.length];
    }
    // Estimate strength
    const pool = chars.length;
    const entropy = Math.round(Math.log2(pool) * len);
    results.push({ pwd, entropy });
  }

  const div = $('pwdResults');
  div.innerHTML = results.map((r, i) => `
    <div class="result-box" style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem 1rem">
      <code style="font-size:1rem;word-break:break-all;flex:1;user-select:all">${r.pwd}</code>
      <div style="display:flex;gap:.35rem;flex-shrink:0">
        <span style="font-size:.75rem;color:var(--gray-400);padding:.2rem .4rem;background:var(--gray-100);border-radius:4px">${r.entropy} bit</span>
        <button class="btn btn-sm btn-secondary" onclick="copyText('${r.pwd}')">📋</button>
      </div>
    </div>
  `).join('');
}
// Generate on load
generatePasswords();
</script>
</body>
