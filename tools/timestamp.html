<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>时间戳转换 - H24 工具箱</title>
<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><a href="../">H24 工具箱</a></header>
<main><h1>时间戳转换</h1>
<p>Unix 时间戳与日期时间互转。</p>
<div><label>时间戳 -> 日期</label><input id="ts" placeholder="输入时间戳..."><button onclick="t2d()">转换</button><pre id="r1"></pre></div>
<div><label>日期 -> 时间戳</label><input type="datetime-local" id="dt"><button onclick="d2t()">转换</button><pre id="r2"></pre></div>
</main>
<script>
function t2d(){var v=document.getElementById('ts').value.trim();if(!v)return;var n=parseInt(v);if(isNaN(n))return;var d=new Date(v.length>=13?n:n*1000);document.getElementById('r1').textContent='北京时间: '+d.toLocaleString('zh-CN')+'\nUTC: '+d.toUTCString()+'\nISO: '+d.toISOString()}
function d2t(){var v=document.getElementById('dt').value;if(!v)return;var d=new Date(v);document.getElementById('r2').textContent='秒级: '+Math.floor(d.getTime()/1000)+'\n毫秒级: '+d.getTime()}
(function(){var n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());document.getElementById('dt').value=n.toISOString().slice(0,16)})();
</script>
</body></html>
