<div id="toast" class="toast"></div>
<script src="../js/main.js"></script>
<script>
let mode = 'encode';
let fileData = null;

function switchMode(m) {
  mode = m;
  $('encodeBtn').className = m === 'encode' ? 'btn btn-primary' : 'btn btn-secondary';
  $('decodeBtn').className = m === 'decode' ? 'btn btn-primary' : 'btn btn-secondary';
  $('base64Input').placeholder = m === 'encode' ? '输入要编码的文本�? : '输入 Base64 字符串�?;
  $('base64File').disabled = m !== 'encode';
  $('base64File').style.opacity = m === 'encode' ? '1' : '.4';
}

function handleFile() {
  const file = $('base64File').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    fileData = e.target.result; // base64 data URL
    $('base64Input').value = fileData;
    toast(`�?已读取文�? ${file.name} (${formatSize(file.size)})`);
  };
  reader.readAsDataURL(file);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function convertBase64() {
  const input = $('base64Input').value.trim();
  const output = $('base64Output');
  const status = $('base64Status');

  if (!input) { output.innerHTML = '<span class="result-empty">请输入内�?/span>'; status.innerHTML = ''; return; }

  try {
    if (mode === 'encode') {
      const encoded = btoa(unescape(encodeURIComponent(input)));
      output.textContent = encoded;
      status.innerHTML = `<div class="status-msg success">�?编码成功 · ${encoded.length} 字符</div>`;
      $('downloadBase64Btn').disabled = true;
    } else {
      // Decode: try base64 �?UTF-8
      try {
        const decoded = decodeURIComponent(escape(atob(input)));
        output.textContent = decoded;
        status.innerHTML = `<div class="status-msg success">�?解码成功 · ${decoded.length} 字符</div>`;
        $('downloadBase64Btn').disabled = false;
      } catch {
        // Maybe it's binary data �?offer download
        try {
          const binary = atob(input);
          output.innerHTML = `<span class="result-empty">二进制数据，无法显示为文本。点�?下载"保存为文件�?/span>`;
          status.innerHTML = `<div class="status-msg success">�?解码成功 · ${binary.length} 字节 (二进制数�?</div>`;
          $('downloadBase64Btn').disabled = false;
        } catch(e2) {
          throw new Error('无效�?Base64 字符�?);
        }
      }
    }
  } catch(e) {
    output.innerHTML = '<span class="result-empty">转换失败</span>';
    status.innerHTML = `<div class="status-msg error">�?${e.message}</div>`;
    $('downloadBase64Btn').disabled = true;
  }
}

function downloadBase64Result() {
  const input = $('base64Input').value.trim();
  if (!input || mode !== 'decode') return;
  try {
    const binary = atob(input.replace(/^data:[^;]+;base64,/, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes]);
    downloadBlob(blob, 'decoded_file');
  } catch(e) {
    toast('�?无法下载: ' + e.message);
  }
}
</script>
