<script>
var b64mode='encode';
function setMode(m){b64mode=m;document.getElementById('encBtn').className=m==='encode'?'btn btn-primary':'btn btn-secondary';document.getElementById('decBtn').className=m==='decode'?'btn btn-primary':'btn btn-secondary';document.getElementById('b64Input').placeholder=m==='encode'?'杈撳叆瑕佺紪鐮佺殑鏂囨湰鈥?:'杈撳叆 Base64 瀛楃涓测€?;document.getElementById('b64File').disabled=m!=='encode'}
function loadFile(){var f=document.getElementById('b64File').files[0];if(!f)return;var r=new FileReader();r.onload=function(e){document.getElementById('b64Input').value=e.target.result;toast('宸茶鍙? '+f.name)};r.readAsDataURL(f)}
function convert(){
  var inp=document.getElementById('b64Input').value.trim(),out=document.getElementById('b64Output'),st=document.getElementById('b64Status');

}
