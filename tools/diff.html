<script>
function loadDemo() {
  $('diffLeft').value = `function hello() {
  console.log("Hello World");
  return true;
}

const name = "张三";
console.log(name);`;

  $('diffRight').value = `function hello() {
  console.log("Hello H24!");
  return false;
}

const name = "李四";
const age = 28;
console.log(name, age);`;
  runDiff();
}

function runDiff() {
  const left = $('diffLeft').value;
  const right = $('diffRight').value;
  const result = $('diffResult');

  if (!left && !right) { result.innerHTML = '<span class="result-empty" style="display:block;padding:1rem">请输入文本进行对�?/span>'; return; }

  const linesA = left.split('\n');
  const linesB = right.split('\n');

  // LCS-based diff
  const dp = lcsMatrix(linesA, linesB);
  const diffLines = backtrackDiff(dp, linesA, linesB, linesA.length, linesB.length);

  let html = '<table style="width:100%;border-collapse:collapse;font-family:monospace;font-size:.85rem">';
  let addCount = 0, delCount = 0, eqCount = 0;
  for (const d of diffLines) {
    const cls = d.type === 'add' ? 'diff-add' : d.type === 'del' ? 'diff-del' : 'diff-eq';
    const sign = d.type === 'add' ? '+' : d.type === 'del' ? '-' : ' ';
    const bg = d.type === 'add' ? '#dcfce7' : d.type === 'del' ? '#fee2e2' : 'transparent';
    html += `<tr style="background:${bg}"><td style="width:2rem;text-align:right;color:var(--gray-400);padding:.15rem .5rem;user-select:none;border-right:1px solid var(--gray-200)">${d.lno}</td><td style="width:1.5rem;text-align:center;color:${d.type === 'add' ? '#16a34a' : d.type === 'del' ? '#dc2626' : 'var(--gray-400)'};user-select:none;padding:.15rem 0">${sign}</td><td style="padding:.15rem .5rem;white-space:pre-wrap">${escapeHtml(d.text)}</td></tr>`;
    if (d.type === 'add') addCount++;
    else if (d.type === 'del') delCount++;
    else eqCount++;
  }
  html += '</table>';
  result.innerHTML = html;

  $('diffStats').innerHTML = `
    <span style="color:#16a34a">+${addCount} 新增</span> ·
    <span style="color:#dc2626">-${delCount} 删除</span> ·
    <span style="color:var(--gray-400)">${eqCount} 行相�?/span> ·
    <span style="color:var(--gray-400)">变更 ${((addCount+delCount)/(eqCount+addCount+delCount)*100).toFixed(1)}%</span>
  `;
}

function lcsMatrix(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => new Int32Array(n+1));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp;
}

function backtrackDiff(dp, a, b, i, j) {
  const result = [];
  let lnoA = 0, lnoB = 0;
  function walk(i, j) {
    if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
      walk(i-1, j-1);
      result.push({ type: 'eq', text: a[i-1], lno: ++lnoA });
      lnoB++;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      walk(i, j-1);
      result.push({ type: 'add', text: b[j-1], lno: ++lnoB });
    } else if (i > 0) {
      walk(i-1, j);
      result.push({ type: 'del', text: a[i-1], lno: ++lnoA });
    }
  }
  walk(i, j);
  return result;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

</script>
