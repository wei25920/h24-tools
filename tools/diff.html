<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文本对比工具 - H24 工具箱</title>
<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><a href="../">H24 工具箱</a></header>
<main><h1>文本对比工具</h1>
<p>逐行对比两段文本差异。</p>
<div><textarea id="a" rows="5" placeholder="原始文本..."></textarea><textarea id="b" rows="5" placeholder="新文本..."></textarea>
<button onclick="d()">对比</button><div id="o" style="font-family:monospace;font-size:.85rem"></div></div>
</main>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function d(){var a=document.getElementById('a').value.split('\n'),b=document.getElementById('b').value.split('\n');if(!a.join()&&!b.join()){document.getElementById('o').textContent='';return}
var dp=Array.from({length:a.length+1},function(){return new Int32Array(b.length+1)});
for(var i=1;i<=a.length;i++)for(var j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
var r=[];function w(i,j){if(i>0&&j>0&&a[i-1]===b[j-1]){w(i-1,j-1);r.push({t:'e',v:a[i-1]})}else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){w(i,j-1);r.push({t:'+',v:b[j-1]})}else if(i>0){w(i-1,j);r.push({t:'-',v:a[i-1]})}}
w(a.length,b.length);var h='<table style=width:100%>';r.forEach(function(d){var bg=d.t==='+'?'#dcfce7':d.t==='-'?'#fee2e2':'transparent';h+='<tr style=background:'+bg+'><td style=text-align:center;color:'+(d.t==='+'?'#16a34a':d.t==='-'?'#dc2626':'var(--gray-400)')+';width:1.5rem>'+d.t+'</td><td style=padding:.1rem .5rem>'+esc(d.v)+'</td></tr>'});
h+='</table>';document.getElementById('o').innerHTML=h}
</script>
</body></html>
