<header class="site-header">
  <div class="header-inner">
    <a href="../" class="logo"><span class="logo-icon">H24</span><span>工具�?/span></a>

<main class="tool-page">
  <div class="tool-page-header">

    <h1>🧪 正则测试�?/h1>
    <p>编写和测试正则表达式，实时高亮匹配结果�?/p>
  </div>
  <div class="tool-box">
    <div class="input-group">
      <label for="regexPattern">正则表达�?/label>
      <div style="display:flex;gap:.5rem;align-items:center">
        <code style="color:var(--gray-400)">/</code>
        <input type="text" id="regexPattern" value="\d+" style="flex:1;font-family:monospace" oninput="debounceTest()" placeholder="输入正则表达�?>
        <code style="color:var(--gray-400)">/</code>
        <input type="text" id="regexFlags" value="g" style="width:80px;font-family:monospace" oninput="debounceTest()" placeholder="gim">
      </div>
    </div>
    <div class="input-group">
      <label for="regexText">测试文本</label>
      <textarea id="regexText" rows="6" oninput="debounceTest()" placeholder="在此输入要匹配的文本�?>Hello 2026! 价格: 99 元，库存: 42 件�?/textarea>
    </div>
    <div class="input-group">
      <label for="regexReplace">替换文本（可选）</label>
      <input type="text" id="regexReplace" placeholder="输入替换文本�? oninput="debounceTest()">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="testRegex()">�?测试</button>
      <button class="btn btn-secondary" onclick="clearRegex()">🗑 清空</button>
    </div>
    <div id="regexOutput" class="result-box" style="min-height:100px;white-space:pre-wrap;font-family:monospace"><span class="result-empty">等待测试�?/span></div>

<div id="toast" class="toast"></div>
<script src="../js/main.js"></script>
<script>
function debounceTest() {
  clearTimeout(window._regexTimer);
  window._regexTimer = setTimeout(testRegex, 300);
}

function testRegex() {
  const pattern = $('regexPattern').value;
  const flags = $('regexFlags').value;
  const text = $('regexText').value;
  const replace = $('regexReplace').value;
  const output = $('regexOutput');
  const info = $('regexInfo');

  if (!pattern) { output.innerHTML = '<span class="result-empty">请输入正则表达式</span>'; info.textContent = ''; return; }

  try {
    const re = new RegExp(pattern, flags);
    const matches = [...text.matchAll(re)];

    if (replace) {
      const replaced = text.replace(re, replace);
      output.innerHTML = `<div>替换结果:</div><div style="margin-top:.3rem">${escapeHtml(replaced)}</div>`;
      info.innerHTML = `<span style="color:var(--gray-400)">替换完成 · ${matches.length} 处匹�?/span>`;
      return;
    }

    if (matches.length === 0) {
      output.innerHTML = '<span class="result-empty">无匹配结�?/span>';
      info.innerHTML = `<span style="color:var(--gray-500)">未找到匹�?/span>`;
      return;
    }

    // Highlight matches
    let lastIndex = 0;
    let html = '';
    const reGlobal = new RegExp(pattern, flags.includes('g') ? flags : flags + 'g');
    let match;
    let matchCount = 0;
    let totalLen = 0;
    while ((match = reGlobal.exec(text)) !== null) {
      html += escapeHtml(text.slice(lastIndex, match.index));
      html += `<mark style="background:#fde68a;padding:.1rem .15rem;border-radius:2px">${escapeHtml(match[0])}</mark>`;
      lastIndex = reGlobal.lastIndex;
      matchCount++;
      totalLen += match[0].length;
      if (match.index === reGlobal.lastIndex) reGlobal.lastIndex++;
    }
    html += escapeHtml(text.slice(lastIndex));

    output.innerHTML = `<div style="margin-bottom:.5rem;color:var(--gray-500);font-size:.85rem">匹配 ${matchCount} 处，�?${totalLen} 字符</div><div>${html}</div>`;

    // Show capture groups for first match
    const firstMatch = [...text.matchAll(re)][0];
    if (firstMatch && firstMatch.length > 1) {
      let groupInfo = '<div style="margin-top:.5rem;font-size:.85rem">捕获�? ';
      for (let i = 1; i < firstMatch.length; i++) {
        groupInfo += `<code style="background:var(--gray-100);padding:.1rem .4rem;border-radius:3px;margin:0 .2rem">$${i}: ${escapeHtml(firstMatch[i] || '(undefined)')}</code> `;
      }
      groupInfo += '</div>';
      info.innerHTML = groupInfo;
    } else {
      info.innerHTML = '';
    }
  } catch(e) {
    output.innerHTML = '<span class="result-empty">正则表达式错�?/span>';
    info.innerHTML = `<span style="color:#dc2626">�?${escapeHtml(e.message)}</span>`;
  }
}

function clearRegex() {
  $('regexPattern').value = '';
  $('regexText').value = '';
  $('regexReplace').value = '';
  $('regexOutput').innerHTML = '<span class="result-empty">等待测试�?/span>';
  $('regexInfo').textContent = '';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Run on load
testRegex();
</script>
</body>
</html>
