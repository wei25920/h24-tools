<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>正则测试器 - H24 工具箱</title>
<meta name="description" content="免费在线正则表达式测试工具。">
<link rel="stylesheet" href="../css/style.css">

<script defer src="https://cloud.umami.is/script.js" data-website-id="请填入你的 Umami 网站 ID"></script>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a href="../" class="logo"><span class="logo-icon">H24</span><span>工具箱</span></a>
<nav class="header-nav"><a href="../">返回首页</a></nav>
</div>
</header>
<main class="tool-page">
<div class="tool-page-header"><a href="../" class="back-link">返回全部工具</a><h1>正则测试器</h1><p>在线测试正则表达式，实时匹配高亮。</p></div>
<div class="tool-box">
<div class="input-group"><label for="reP">正则</label><input type="text" id="reP" value="\d+" style="font-family:monospace" oninput="rt()" placeholder="pattern"></div>
<div class="input-group"><label for="reT">测试文本</label><textarea id="reT" rows="6" oninput="rt()" placeholder="输入要匹配的文本..." style="min-height:120px">Hello 2026! 价格 99 元</textarea></div>
<div class="btn-row"><button class="btn btn-primary" onclick="rt()">测试</button></div>
<div id="reO" class="result-box" style="min-height:80px"><span class="result-empty">等待测试...</span></div>
</div>
</main>
<footer class="site-footer">H24 工具箱 &copy; 2026</footer>
<script src="../js/main.js"></script>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function rt(){
var p=document.getElementById('reP').value;var t=document.getElementById('reT').value;var o=document.getElementById('reO');
if(!p){o.innerHTML='<span class=result-empty>请输入正则</span>';return}
try{var re=new RegExp(p,'g');var m=[],mm;while((mm=re.exec(t))!==null){m.push(mm[0]);if(mm.index===re.lastIndex)re.lastIndex++}
if(m.length===0){o.innerHTML='<span class=result-empty>无匹配</span>';return}
var li=0,h='',re2=new RegExp(p,'g');while((mm=re2.exec(t))!==null){h+=esc(t.slice(li,mm.index));h+='<mark style=background:#fde68a;border-radius:2px>'+esc(mm[0])+'</mark>';li=re2.lastIndex;if(mm.index===re2.lastIndex)re2.lastIndex++}
h+=esc(t.slice(li));o.innerHTML=h+'<div style=margin-top:.3rem;color:var(--gray-500)>匹配 '+m.length+' 处</div>'}
catch(e){o.innerHTML='<span class=result-empty>正则错误</span>'}}
rt();
</script>
</body>
</html>
