<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>正则测试器 - H24 工具箱</title>
<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><a href="../">H24 工具箱</a></header>
<main><h1>正则测试器</h1>
<p>在线测试正则表达式，实时匹配高亮。</p>
<div><label>正则</label><input id="p" value="\d+" oninput="t()" style="font-family:monospace">
<label>文本</label><textarea id="x" rows="4" oninput="t()">Hello 2026! 价格 99 元</textarea>
<div id="o" style="padding:.5rem;background:var(--gray-50);border-radius:6px;min-height:40px"></div></div>
</main>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function t(){var p=document.getElementById('p').value,x=document.getElementById('x').value;if(!p){document.getElementById('o').textContent='';return}
try{var re=new RegExp(p,'g'),m=[],mm;while((mm=re.exec(x))!==null){m.push(mm[0]);if(mm.index===re.lastIndex)re.lastIndex++}
var h='<span style=color:var(--gray-400)>匹配: '+m.length+' 处</span><br>';var li=0,re2=new RegExp(p,'g');
while((mm=re2.exec(x))!==null){h+=esc(x.slice(li,mm.index));h+='<mark style=background:#fde68a;border-radius:2px>'+esc(mm[0])+'</mark>';li=re2.lastIndex;if(mm.index===re2.lastIndex)re2.lastIndex++}
h+=esc(x.slice(li));document.getElementById('o').innerHTML=h}
catch(e){document.getElementById('o').textContent='正则错误: '+e.message}}
t();
</script>
</body></html>
