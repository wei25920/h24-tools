<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>二维码生成器 - H24 工具箱</title>
<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><a href="../">H24 工具箱</a></header>
<main><h1>二维码生成器</h1>
<p>输入文本或链接，生成二维码，支持下载 PNG。</p>
<div><textarea id="q" placeholder="输入内容..."></textarea><button onclick="g()">生成</button><div id="qr"></div></div>
</main>
<script src="../js/qrcode.min.js"></script>
<script>function g(){var t=document.getElementById('q').value.trim();if(t)try{new QRCode(document.getElementById('qr'),{text:t,width:200,height:200})}catch(e){}}
</script>
</body></html>
