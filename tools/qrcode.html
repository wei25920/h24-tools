</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../" class="logo">
      <span class="logo-icon">H24</span>
      <span>工具�?/span>
    </a>
    <nav class="header-nav">
      <a href="../">�?返回首页</a>
    </nav>
  </div>
</header>

<main class="tool-page">
  <div class="tool-page-header">
    <a href="../" class="back-link">�?返回全部工具</a>
    <h1>📱 二维码生成器</h1>
    <p>输入文本或链接，一键生成二维码，支持下载高�?PNG�?/p>
  </div>

  <div class="tool-box">
    <div class="input-group">
      <label for="qrInput">输入内容</label>
      <textarea id="qrInput" rows="3" placeholder="输入文本、网址�?例如：https://example.com"></textarea>
    </div>

    <div class="input-group" style="display:flex;gap:.8rem;flex-wrap:wrap">
      <div style="flex:1;min-width:120px">
        <label for="qrSize">尺寸 (px)</label>
        <select id="qrSize">
          <option value="200">200 × 200</option>
          <option value="300" selected>300 × 300</option>
          <option value="400">400 × 400</option>
          <option value="500">500 × 500</option>
        </select>
      </div>
      <div style="flex:1;min-width:120px">
        <label for="qrECC">纠错等级</label>
        <select id="qrECC">
          <option value="L">�?(L)</option>
          <option value="M" selected>�?(M)</option>
          <option value="Q">较高 (Q)</option>
          <option value="H">�?(H)</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="generateQR()">生成二维�?/button>
      <button class="btn btn-secondary" id="downloadBtn" onclick="downloadQR()" disabled>下载 PNG</button>
    </div>

    <div class="result-box" style="text-align:center;padding:1.5rem;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div id="qrContainer" style="background:white;padding:8px;border-radius:4px;display:inline-block"></div>
      <p id="qrHint" style="color:var(--gray-400);margin-top:1rem">点击「生成二维码」预�?/p>

  </div>
</main>

<footer class="site-footer">
  <p>H24 工具�?&copy; 2026 &middot; 纯前�?· 隐私安全</p>
</footer>
<div id="toast" class="toast"></div>

<script src="../js/main.js"></script>
<script src="../js/qrcode.min.js"></script>
<script>
let currentQRDataURL = null;
let qrInstance = null;

function getECLevel() {
  const map = { L: QRCode.CorrectLevel.L, M: QRCode.CorrectLevel.M, Q: QRCode.CorrectLevel.Q, H: QRCode.CorrectLevel.H };
  return map[$('qrECC').value] || QRCode.CorrectLevel.M;
}

function generateQR() {
  const text = $('qrInput').value.trim();
  if (!text) { toast('⚠️ 请输入要生成的内�?); return; }

  const size = parseInt($('qrSize').value);
  const container = $('qrContainer');
  
  // Clear previous
  container.innerHTML = '';
  
  try {
    qrInstance = new QRCode(container, {
      text: text,
      width: size,
      height: size,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: getECLevel()
    });
    
    // Wait a tick for render then get data URL
    setTimeout(() => {
      const canvas = container.querySelector('canvas');
      if (canvas) {
        currentQRDataURL = canvas.toDataURL('image/png');
        $('downloadBtn').disabled = false;
        $('qrHint').textContent = '�?生成成功！点击下载保�?;
        toast('�?二维码已生成');
      }
    }, 100);
  } catch(e) {
    toast('�?生成失败: ' + e.message);
  }
}

function downloadQR() {
  if (!currentQRDataURL) return;
  const a = document.createElement('a');
  a.href = currentQRDataURL;
  const text = $('qrInput').value.trim().substring(0, 20).replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
  a.download = `qrcode_${text || 'h24'}.png`;
  a.click();
}

$('qrInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) generateQR();
});
</script>
