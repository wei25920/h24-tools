  <div class="input-group">
    <label for="jsonInput">杈撳叆 JSON</label>
    <textarea id="jsonInput" rows="8" placeholder='{"name":"H24","version":1}'></textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="fmt(2)">鏍煎紡鍖?/button>
    <button class="btn btn-secondary" onclick="fmt(0)">鍘嬬缉</button>
    <button class="btn btn-secondary" onclick="fmt(4)">缂╄繘 4</button>
    <button class="btn btn-secondary" onclick="var o=document.getElementById('jsonOutput');navigator.clipboard.writeText(o.textContent).then(function(){toast('宸插鍒?)})">澶嶅埗缁撴灉</button>
  </div>
  <div class="input-group"><label>杈撳嚭</label>

<div id="toast" class="toast"></div>
<script src="../js/main.js"></script>
<script>
function fmt(sp){
  var inp=document.getElementById('jsonInput').value.trim(),out=document.getElementById('jsonOutput'),st=document.getElementById('jsonStatus');
  if(!inp){out.innerHTML='<span class="result-empty">璇疯緭鍏?JSON</span>';st.innerHTML='';return}
  try{var p=JSON.parse(inp),f=JSON.stringify(p,null,sp);out.textContent=f;var ln=f.split('\n').length;st.innerHTML='<div class="status-msg success">鉁?鏍￠獙閫氳繃 路 '+ln+' 琛?/div>'}
  catch(e){out.innerHTML='<span class="result-empty">瑙ｆ瀽澶辫触</span>';st.innerHTML='<div class="status-msg error">鉂?'+e.message+'</div>'}
}
document.getElementById('jsonInput').addEventListener('paste',function(){setTimeout(function(){fmt(2)},50)});
</script>
