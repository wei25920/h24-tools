<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JSON 格式化 - H24 工具箱</title>
<meta name="description" content="免费在线 JSON 格式化工具。">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a href="../" class="logo"><span class="logo-icon">H24</span><span>工具箱</span></a>
<nav class="header-nav"><a href="../">返回首页</a></nav>
</div>
</header>
<main class="tool-page">
<div class="tool-page-header"><a href="../" class="back-link">返回全部工具</a><h1>JSON 格式化</h1><p>格式化、压缩、校验 JSON 数据。</p></div>
<div class="tool-box">
<div class="input-group"><label for="jsonInput">输入 JSON</label><textarea id="jsonInput" rows="8" placeholder='{"name":"H24","version":1}'></textarea></div>
<div class="btn-row">
<button class="btn btn-primary" onclick="fmt(2)">格式化</button>
<button class="btn btn-secondary" onclick="fmt(0)">压缩</button>
<button class="btn btn-secondary" onclick="fmt(4)">缩进 4</button>
</div>
<label>输出</label>
<div id="jsonOutput" class="result-box" style="min-height:120px"><span class="result-empty">等待输入...</span></div>
<div id="jsonStatus"></div>
</div>
</main>
<footer class="site-footer">H24 工具箱 &copy; 2026</footer>
<div id="toast" class="toast"></div>
<script src="../js/main.js"></script>
<script>
function fmt(sp){
var i=document.getElementById('jsonInput').value.trim();
var o=document.getElementById('jsonOutput');
var s=document.getElementById('jsonStatus');
if(!i){o.innerHTML='<span class=result-empty>请输入 JSON</span>';s.innerHTML='';return}
try{var p=JSON.parse(i);o.textContent=JSON.stringify(p,null,sp);s.innerHTML='<div class=status-msg success>格式化成功</div>'}
catch(e){o.innerHTML='<span class=result-empty>解析失败</span>';s.innerHTML='<div class=status-msg error>'+e.message+'</div>'}}
</script>
</body>
</html>
