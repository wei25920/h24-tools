<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>URL 编解码 - H24 工具箱</title>
<link rel="stylesheet" href="../css/style.css">
</head><body>
<header><a href="../">H24 工具箱</a></header>
<main><h1>URL 编解码</h1>
<p>URL 编码与解码。</p>
<div><textarea id="i" placeholder="输入文本..."></textarea>
<button onclick="c('enc')">编码</button><button onclick="c('dec')">解码</button>
<pre id="o"></pre></div>
</main>
<script>
function c(m){var i=document.getElementById('i').value;if(!i)return;var o=document.getElementById('o');try{o.textContent=m==='enc'?encodeURIComponent(i):decodeURIComponent(i)}catch(e){o.textContent='错误: '+e.message}}
</script>
</body></html>
